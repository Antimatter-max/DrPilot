version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drpilot_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://drpilot:secretpass@db:5432/drpilot_db
      - QDRANT_URL=http://vector_db:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - vector_db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL Relational DB
  db:
    image: postgres:15-alpine
    container_name: drpilot_postgres
    environment:
      POSTGRES_USER: drpilot
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: drpilot_db
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data

  # Qdrant Vector DB (Medical Guidelines RAG)
  vector_db:
    image: qdrant/qdrant:latest
    container_name: drpilot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant_data:/qdrant/storage
      - ./backend:/app

  # Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: drpilot_redis
    ports:
      - "6379:6379"